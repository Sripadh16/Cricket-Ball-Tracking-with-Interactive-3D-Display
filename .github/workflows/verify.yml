name: Verify application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0t64
      - run: python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r backend/requirements-test.txt
      - working-directory: backend
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/crease-lab.db
          UPLOAD_DIR: ${{ runner.temp }}/crease-lab-uploads
          LOG_FILE: ${{ runner.temp }}/crease-lab.log
        run: python -m pytest -q tests
      - run: python scripts/generate_standard_deliveries.py --check
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run build
        env:
          GENERATE_SOURCEMAP: 'false'
      - working-directory: .
        run: node scripts/audit_ui.cjs "$(command -v google-chrome)" docs/ui-audit/fixture.json tmp/ui-audit
