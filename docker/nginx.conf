log_format crease_redacted '$remote_addr "$request_method $uri" $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=workspace_auth:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=video_upload:10m rate=12r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log crease_redacted;
    client_max_body_size 101m;
    limit_req_status 429;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/auth/ {
        limit_req zone=workspace_auth burst=20 nodelay;
        proxy_pass http://backend:8000/auth/;
    }

    location = /api/videos/upload {
        limit_req zone=video_upload burst=4 nodelay;
        proxy_pass http://backend:8000/videos/upload;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
    }
}
