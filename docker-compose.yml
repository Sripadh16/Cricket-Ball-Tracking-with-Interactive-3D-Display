version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# STATUS: Docker path is provided for reference and is NOT verified to work
# end-to-end. The primary (tested) path is local SQLite — see README.md.
# If you use Docker, verify the init.sql schema matches the ORM before running.
# ─────────────────────────────────────────────────────────────────────────────
#
# Env-var names are aligned with config.py (backend/src/config.py):
#   DATABASE_URL, UPLOAD_DIR, JWT_SECRET_KEY, JWT_ALGORITHM,
#   JWT_ACCESS_TOKEN_EXPIRE_MINUTES, CORS_ORIGINS, MAX_UPLOAD_SIZE_MB
#
# Redis is NOT used by the application — removed from backend depends_on.
# Redis service kept only as an optional cache sidecar (profile: optional).

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: drs-postgres
    environment:
      POSTGRES_DB: drs_db
      POSTGRES_USER: drs_user
      POSTGRES_PASSWORD: drs_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - drs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drs_user -d drs_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-builder
    container_name: drs-backend
    environment:
      # Aligned with config.py env var names
      - DATABASE_URL=postgresql://drs_user:drs_password@db:5432/drs_db
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_SIZE_MB=500
      # JWT — config.py reads JWT_SECRET_KEY, JWT_ALGORITHM, JWT_ACCESS_TOKEN_EXPIRE_MINUTES
      - JWT_SECRET_KEY=change-this-before-any-non-local-use
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      # CORS — comma-separated origins
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80
      - LOG_LEVEL=INFO
      - MAX_PROCESSING_FRAMES=300
      # REDIS_URL is NOT read by config.py — omitted intentionally
    volumes:
      - ./backend:/app/backend
      - uploads:/app/uploads
      - logs:/app/logs
    ports:
      - "8000:8000"
    networks:
      - drs-network
    depends_on:
      db:
        condition: service_healthy
      # redis removed — not used by application code
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "
        cd /app/backend &&
        PYTHONPATH=/app/backend/src uvicorn main:app --host 0.0.0.0 --port 8000
      "

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-builder
    container_name: drs-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    networks:
      - drs-network
    depends_on:
      - backend
    command: >
      sh -c "
        cd /app/frontend &&
        npm start
      "

  # ── Nginx (production profile only) ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: drs-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/ssl/certs:ro
      - logs:/var/log/nginx
    networks:
      - drs-network
    depends_on:
      - backend
      - frontend
    profiles:
      - production

  # ── Redis (optional, not used by application code) ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: drs-redis
    ports:
      - "6379:6379"
    networks:
      - drs-network
    profiles:
      - optional   # opt-in only; backend does not require it

volumes:
  postgres_data:
  uploads:
  logs:

networks:
  drs-network:
    driver: bridge
