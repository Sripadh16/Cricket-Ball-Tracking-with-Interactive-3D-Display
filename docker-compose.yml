services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: drs_db
      POSTGRES_USER: drs_user
      POSTGRES_PASSWORD: ${DRS_DB_PASSWORD:?Set DRS_DB_PASSWORD in the environment or root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "drs_user", "-d", "drs_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      target: backend
    environment:
      APP_ENV: production
      POSTGRES_HOST: db
      POSTGRES_DB: drs_db
      POSTGRES_USER: drs_user
      POSTGRES_PASSWORD: ${DRS_DB_PASSWORD:?Set DRS_DB_PASSWORD in the environment or root .env}
      JWT_SECRET_KEY: ${DRS_JWT_SECRET:?Set DRS_JWT_SECRET to a deployment-specific random value}
      UPLOAD_DIR: /app/uploads
      LOG_FILE: /app/logs/app.log
      MAX_UPLOAD_SIZE_MB: "100"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "127.0.0.1:${DRS_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
  uploads:
  logs:
